name: Build and Release (x86_64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "20*" ]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/govee2mqtt-5-custom

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Binary (Release)
        run: |
          cargo build --release
          # Create the folder and move the binary to where Docker expects it
          mkdir -p addon/bin
          cp target/release/govee addon/bin/govee
          chmod +x addon/bin/govee

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./addon/
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Notify Home Assistant (Optional Tag-only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: home-assistant/builder@2025.09.0
        with:
          args: |
            --amd64 \
            --target /data/addon
